<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 760" role="document" aria-labelledby="title description">
  <title id="title">Happy OS — Open your desktop</title>
  <desc id="description">A lightweight launcher. Choose Open Happy OS to use the real desktop directly, without an iframe. Gaming mode is also available.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#35445f"/><stop offset="1" stop-color="#10121b"/></radialGradient>
    <linearGradient id="button" x2="1" y2="1"><stop stop-color="#c4d8ff"/><stop offset="1" stop-color="#a8b6f2"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#10121b"/>
  <ellipse cx="600" cy="310" rx="590" ry="420" fill="url(#glow)"/>
  <g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="550" y="170" width="100" height="100" rx="28" fill="#ffffff0d" stroke="#ffffff30"/>
    <text x="600" y="239" font-size="58" font-weight="650" fill="#e2eaff">H</text>
    <text x="600" y="333" font-size="47" font-weight="650" letter-spacing="-2" fill="#f4f5ff">Your space. Happy OS.</text>
    <text x="600" y="379" font-size="19" fill="#abb7cc">Open the full desktop on its public website.</text>
    <a href="https://ember-live-desktop.annamakoye33.chatgpt.site/" target="_top" aria-label="Open Happy OS desktop">
      <rect x="430" y="424" width="340" height="64" rx="16" fill="url(#button)"/>
      <text x="600" y="464" font-size="20" font-weight="650" fill="#1b2943">Open Happy OS ↗</text>
    </a>
    <a href="https://ember-live-desktop.annamakoye33.chatgpt.site/?gaming=1" target="_top" aria-label="Open Happy OS gaming mode">
      <rect x="455" y="510" width="290" height="52" rx="14" fill="#ffffff08" stroke="#ffffff30"/>
      <text x="600" y="543" font-size="17" fill="#d4def1">Open gaming mode ↗</text>
    </a>
    <text x="600" y="624" font-size="14" fill="#8492aa">CDN launcher · Happy OS opens directly, not inside another page.</text>
  </g>
</svg>